name: MuJoCo CPU checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.8,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: diablo fetch
      - run: python -m unittest discover -s tests -v
      - run: diablo doctor
      - run: diablo train --steps 512 --n-envs 2 --output runs/ci-train
      - run: diablo export --model runs/ci-train/policy.zip --output runs/ci-export
