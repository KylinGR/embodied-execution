name: MuJoCo CPU checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.8,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: diablo fetch
      - run: PYTHON=python bash scripts/check_training.sh
      - name: Install wheel outside the source checkout
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv --system-site-packages "$RUNNER_TEMP/diablo-wheel"
          "$RUNNER_TEMP/diablo-wheel/bin/python" -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          export DIABLO_ASSET_DIR="$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/diablo-wheel/bin/python" -c 'import diablo_training; print(diablo_training.__file__); assert "diablo-wheel" in diablo_training.__file__'
          "$RUNNER_TEMP/diablo-wheel/bin/diablo" doctor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-training-evidence
          path: runs/
          retention-days: 14
